services:
  postgres:
    image: postgres:17
    container_name: safenet-zkp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: safenet_zkp
      POSTGRES_USER: safenet
      POSTGRES_PASSWORD: safenet_dev_password
    ports:
      - "5432:5432"
    volumes:
      - safenet_zkp_postgres_data:/var/lib/postgresql/data

volumes:
  safenet_zkp_postgres_data: