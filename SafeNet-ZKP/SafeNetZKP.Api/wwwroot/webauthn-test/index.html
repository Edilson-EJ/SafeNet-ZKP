<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeNet-ZKP — teste local WebAuthn</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; }
    button, input { font: inherit; padding: .5rem; } button { margin: .5rem .5rem .5rem 0; }
    #status { border-left: .25rem solid #4263eb; padding: .5rem 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Teste local de passkeys</h1>
  <p>Use apenas com o banco de teste isolado. O registro cria uma conta e uma passkey de teste.</p>
  <label for="name">Nome de teste</label>
  <input id="name" maxlength="100" value="Visitante de teste">
  <div>
    <button id="register" type="button">1. Registrar passkey</button>
    <button id="authenticate" type="button" disabled>2. Autenticar</button>
  </div>
  <div>
    <button id="session" type="button">Consultar sessão</button>
    <button id="logout" type="button">Encerrar sessão</button>
  </div>
  <p id="status" role="status" aria-live="polite">Aguardando registro.</p>
  <script>
  (() => {
    'use strict';
    const status = document.getElementById('status');
    const registerButton = document.getElementById('register');
    const loginButton = document.getElementById('authenticate');
    const sessionButton = document.getElementById('session');
    const logoutButton = document.getElementById('logout');
    let registeredUserId = null;

    const fromBase64Url = value => {
      const base64 = value.replace(/-/g, '+').replace(/_/g, '/');
      return Uint8Array.from(atob(base64 + '='.repeat((4 - base64.length % 4) % 4)), c => c.charCodeAt(0));
    };
    const toBase64Url = value => {
      let text = '';
      for (const b of new Uint8Array(value)) text += String.fromCharCode(b);
      return btoa(text).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };
    const descriptor = item => ({ ...item, id: fromBase64Url(item.id) });
    const post = async (path, body) => {
      const response = await fetch(path, {
        method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json' },
        body: body === undefined ? undefined : JSON.stringify(body)
      });
      if (!response.ok) throw new Error(`A API rejeitou a etapa (${response.status}).`);
      return response.status === 204 ? null : response.json();
    };
    const registrationJson = credential => ({
      id: credential.id, rawId: toBase64Url(credential.rawId), type: credential.type,
      response: {
        clientDataJSON: toBase64Url(credential.response.clientDataJSON),
        attestationObject: toBase64Url(credential.response.attestationObject),
        transports: credential.response.getTransports?.() ?? []
      },
      clientExtensionResults: credential.getClientExtensionResults()
    });
    const assertionJson = credential => ({
      id: credential.id, rawId: toBase64Url(credential.rawId), type: credential.type,
      response: {
        clientDataJSON: toBase64Url(credential.response.clientDataJSON),
        authenticatorData: toBase64Url(credential.response.authenticatorData),
        signature: toBase64Url(credential.response.signature),
        userHandle: credential.response.userHandle === null ? null : toBase64Url(credential.response.userHandle)
      },
      clientExtensionResults: credential.getClientExtensionResults()
    });
    const run = async action => {
      registerButton.disabled = true;
      loginButton.disabled = true;
      sessionButton.disabled = true;
      logoutButton.disabled = true;
      try { await action(); }
      catch (error) { status.textContent = `Etapa não concluída: ${error.message || 'erro no navegador'}`; }
      finally {
        registerButton.disabled = false;
        loginButton.disabled = registeredUserId === null;
        sessionButton.disabled = false;
        logoutButton.disabled = false;
      }
    };

    registerButton.addEventListener('click', () => run(async () => {
      registeredUserId = null;
      if (!window.isSecureContext || !navigator.credentials) throw new Error('WebAuthn indisponível neste contexto.');
      status.textContent = 'Criando conta de teste…';
      const enrollment = await post('/api/webauthn/enrollment/start', { name: document.getElementById('name').value });
      const pending = await post('/api/webauthn/enrollment/options', { enrollmentToken: enrollment.enrollmentToken });
      const options = pending.options;
      options.challenge = fromBase64Url(options.challenge);
      options.user.id = fromBase64Url(options.user.id);
      options.excludeCredentials = (options.excludeCredentials || []).map(descriptor);
      status.textContent = 'Confirme o registro no autenticador…';
      const credential = await navigator.credentials.create({ publicKey: options });
      if (!credential) throw new Error('Registro cancelado.');
      await post('/api/webauthn/enrollment/complete', {
        operationId: pending.operationId, enrollmentToken: enrollment.enrollmentToken, response: registrationJson(credential)
      });
      registeredUserId = enrollment.userId;
      status.textContent = 'Passkey registrada. Prossiga para autenticar com ela.';
    }));

    loginButton.addEventListener('click', () => run(async () => {
      status.textContent = 'Solicitando desafio de autenticação…';
      const pending = await post('/api/webauthn/authentication/options');
      const options = pending.options;
      options.challenge = fromBase64Url(options.challenge);
      options.allowCredentials = (options.allowCredentials || []).map(descriptor);
      status.textContent = 'Selecione a passkey de teste e confirme no autenticador…';
      const credential = await navigator.credentials.get({ publicKey: options });
      if (!credential) throw new Error('Autenticação cancelada.');
      const result = await post('/api/webauthn/authentication/complete', {
        operationId: pending.operationId, response: assertionJson(credential)
      });
      status.textContent = result.userId === registeredUserId
        ? 'Autenticação concluída: o backend identificou a conta criada neste teste.'
        : 'Autenticação concluída, mas a passkey escolhida pertence a outra conta.';
    }));

    const sessionRequest = (path, options = {}) => {
      if (window.location.protocol !== 'https:') throw new Error('As operações de sessão exigem HTTPS.');
      return fetch(path, { ...options, credentials: 'same-origin', cache: 'no-store', redirect: 'error' });
    };

    sessionButton.addEventListener('click', () => run(async () => {
      status.textContent = 'Consultando sessão…';
      const response = await sessionRequest('/api/auth/me');
      if (response.status === 401) {
        status.textContent = 'Consulta de sessão: HTTP 401. Não há sessão válida.';
        return;
      }
      if (!response.ok) throw new Error(`Consulta de sessão falhou: HTTP ${response.status}.`);
      const session = await response.json();
      status.textContent = `Consulta de sessão: HTTP ${response.status}.\nNome: ${session.name}\nIdentificador: ${session.userId}`;
    }));

    logoutButton.addEventListener('click', () => run(async () => {
      status.textContent = 'Preparando encerramento da sessão…';
      const csrfResponse = await sessionRequest('/api/auth/csrf');
      if (csrfResponse.status === 401) {
        status.textContent = 'Não foi possível encerrar: HTTP 401. Não há sessão válida.';
        return;
      }
      if (!csrfResponse.ok) throw new Error(`Não foi possível preparar o encerramento: HTTP ${csrfResponse.status}.`);
      const csrf = await csrfResponse.json();
      if (typeof csrf.token !== 'string' || !csrf.token) throw new Error('Resposta antiforgery inválida.');
      const logoutResponse = await sessionRequest('/api/auth/logout', {
        method: 'POST', headers: { 'X-CSRF-TOKEN': csrf.token }
      });
      if (!logoutResponse.ok) throw new Error(`Encerramento da sessão falhou: HTTP ${logoutResponse.status}.`);
      const confirmation = await sessionRequest('/api/auth/me');
      status.textContent = confirmation.status === 401
        ? `Sessão encerrada: HTTP ${logoutResponse.status}. Consulta posterior: HTTP 401.`
        : `Encerramento retornou HTTP ${logoutResponse.status}, mas a consulta posterior retornou HTTP ${confirmation.status}; não foi possível confirmar o encerramento.`;
    }));
  })();
  </script>
</body>
</html>
